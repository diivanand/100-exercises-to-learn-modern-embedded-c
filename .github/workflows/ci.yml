name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every reference solution must build and pass on the toolchain the course
  # is written against: Apple clang on macOS. The full matrix (GCC, the
  # sanitizers, formatting, and the starter-must-fail check) can still be run
  # locally with ./scripts/check-course.sh and ./mec.
  solutions:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja
             -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_C_COMPILER=clang
             -DMEC_BUILD_SOLUTIONS=ON
             -DMEC_BUILD_EXERCISES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # A second opinion from GCC on Linux -- the compiler embedded Linux work
  # actually ships with, and the one whose warning set includes a few checks
  # clang does not have (-Wlogical-op, -Wjump-misses-init).
  solutions-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build gcc

      - name: Configure
        run: cmake -S . -B build -G Ninja
             -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_C_COMPILER=gcc
             -DMEC_BUILD_SOLUTIONS=ON
             -DMEC_BUILD_EXERCISES=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The NUCLEO chapters cannot be RUN here (no board on a hosted runner), but
  # they can be COMPILED: arm-none-eabi-gcc needs no hardware. That catches
  # the large majority of mistakes -- a misspelt register, a missing volatile
  # cast, a linker-script typo -- on every push. Running them is what
  # ./mec flash on your desk is for.
  nucleo-compile-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q
             gcc-arm-none-eabi ninja-build

      - name: Configure
        run: cmake -S . -B build-target -G Ninja
             -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
             -DMEC_BUILD_SOLUTIONS=ON
             -DMEC_BUILD_EXERCISES=OFF

      - name: Build
        run: cmake --build build-target
